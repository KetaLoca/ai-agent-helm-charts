apiVersion: v2
name: hermes-agent
description: >-
  Unofficial community Helm chart for the Hermes Agent (nousresearch/hermes-agent).
  Hardened and private by default. Not affiliated with Nous Research.
type: application
# Chart SemVer (independent of the upstream app version).
version: 0.2.0
# Upstream app/image version this chart targets. Pinned to a release tag (SemVer since
# v0.21.6; CalVer vYYYY.M.D before), and
# values.yaml also pins the matching image.digest by default for full immutability.
# Keep both in sync on every bump. See docs/upgrade.md.
appVersion: "v0.21.6"
kubeVersion: ">=1.25.0-0"
home: https://github.com/KetaLoca/ai-agent-helm-charts
sources:
  - https://github.com/NousResearch/hermes-agent
  - https://github.com/KetaLoca/ai-agent-helm-charts
keywords:
  - ai
  - agent
  - hermes
  - llm
maintainers:
  - name: KetaLoca
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/KetaLoca/ai-agent-helm-charts
    - name: upstream
      url: https://github.com/NousResearch/hermes-agent
  artifacthub.io/maintainers: |
    - name: KetaLoca
